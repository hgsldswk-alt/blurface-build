name: BlurFace
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, de, zh-Hans, zh-Hant, ja]
settings:
  base:
    APP_ID: com.hgsldswk.blurface
    APP_STORE_ID: "6837839943"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  BlurFace:
    type: application
    platform: iOS
    sources: [BlurFace, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BlurFace AppStore
    info:
      path: BlurFace/Info.plist
      properties:
        CFBundleDisplayName: PixelVeil
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        NSPhotoLibraryAddUsageDescription: Save your redacted copies to Photos.
  BlurFaceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BlurFaceTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  BlurFaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BlurFaceUITests]
    dependencies:
      - target: BlurFace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BlurFace
schemes:
  BlurFace:
    build:
      targets:
        BlurFace: all
        BlurFaceTests: [test]
    test:
      config: Debug
      targets: [BlurFaceTests]
  BlurFaceUI:
    build:
      targets:
        BlurFace: all
        BlurFaceUITests: [test]
    test:
      config: Debug
      targets: [BlurFaceUITests]
